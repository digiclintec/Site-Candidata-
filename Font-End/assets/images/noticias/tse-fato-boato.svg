<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" preserveAspectRatio="xMidYMid meet" style="background:#071426; font-family: -apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGradShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e102d" />
      <stop offset="50%" stop-color="#2a1b40" />
      <stop offset="100%" stop-color="#0f0c1b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGradShield)" />

  <!-- Escudo Central de Checagem -->
  <g transform="translate(600, 220)">
    <circle cx="0" cy="0" r="100" fill="#2e1065" stroke="#a855f7" stroke-width="3" />
    <!-- Escudo -->
    <path d="M0 -60 C35 -60 55 -50 55 -20 C55 35 25 65 0 80 C-25 65 -55 35 -55 -20 C-55 -50 -35 -60 0 -60 Z" fill="#7c3aed" stroke="#c084fc" stroke-width="2.5" />
    <!-- V de Checado / Verificado -->
    <path d="M-20 0 L-6 16 L24 -14" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Informações Oficiais -->
  <g transform="translate(600, 380)" text-anchor="middle">
    <rect x="-190" y="-30" width="380" height="34" rx="17" fill="#3b0764" stroke="#c084fc" stroke-width="1.5" />
    <text x="0" y="-8" font-size="12.5" font-weight="800" fill="#e9d5ff" letter-spacing="2">CHECAGEM OFICIAL • JUSTIÇA ELEITORAL</text>

    <text x="0" y="45" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Fato ou Boato?</text>
    <text x="0" y="85" font-size="20" font-weight="700" fill="#c084fc">DESMINTINDO DESINFORMAÇÕES SOBRE O SISTEMA ELEITORAL</text>

    <line x1="-160" y1="110" x2="160" y2="110" stroke="#6b21a8" stroke-width="1.5" />

    <text x="0" y="145" font-size="16" font-weight="500" fill="#e9d5ff">Esclarecimentos oficiais contra notícias falsas sobre urnas e procedimentos de votação.</text>
    <text x="0" y="175" font-size="13.5" font-weight="600" fill="#a855f7">Consulte sempre canais oficiais antes de compartilhar.</text>
  </g>
</svg>
