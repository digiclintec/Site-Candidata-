<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#071426; font-family: -apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGradEtitulo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071d2b" />
      <stop offset="50%" stop-color="#0a2a3e" />
      <stop offset="100%" stop-color="#061b24" />
    </linearGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGradEtitulo)" />

  <!-- Smartphone Mockup Central -->
  <g transform="translate(180, 75)">
    <!-- Smartphone Frame -->
    <rect x="0" y="0" width="280" height="520" rx="36" fill="url(#phoneBody)" stroke="#38bdf8" stroke-width="3" />
    <rect x="15" y="15" width="250" height="490" rx="24" fill="#0f172a" />
    <!-- Dynamic Island / Speaker -->
    <rect x="95" y="24" width="90" height="18" rx="9" fill="#000000" />
    
    <!-- App Screen Content -->
    <g transform="translate(25, 60)">
      <!-- Top header -->
      <rect x="0" y="0" width="230" height="45" rx="8" fill="#0369a1" />
      <text x="115" y="28" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">e-Título Oficial</text>

      <!-- Digital card -->
      <rect x="0" y="60" width="230" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="40" cy="105" r="24" fill="#334155" />
      <path d="M40 92 C34 92 30 96 30 102 C30 108 34 112 40 112 C46 112 50 108 50 102 C50 96 46 92 40 92 Z M26 122 C26 117 33 115 40 115 C47 115 54 117 54 122 L26 122 Z" fill="#94a3b8" />
      <text x="75" y="98" font-size="11" font-weight="700" fill="#f8fafc">ELEITOR REGISTRADO</text>
      <text x="75" y="114" font-size="9.5" font-weight="500" fill="#38bdf8">BIOMETRIA COLETADA</text>
      <text x="75" y="130" font-size="9" font-weight="600" fill="#22c55e"><tspan font-weight="800">SITUAÇÃO:</tspan> REGULAR</text>

      <!-- QR Code / Barcode representation -->
      <rect x="0" y="230" width="230" height="160" rx="10" fill="#ffffff" />
      <g transform="translate(45, 245)">
        <rect x="0" y="0" width="140" height="130" fill="#0f172a" />
        <rect x="10" y="10" width="40" height="40" fill="#ffffff" />
        <rect x="20" y="20" width="20" height="20" fill="#0f172a" />
        <rect x="90" y="10" width="40" height="40" fill="#ffffff" />
        <rect x="100" y="20" width="20" height="20" fill="#0f172a" />
        <rect x="10" y="80" width="40" height="40" fill="#ffffff" />
        <rect x="20" y="90" width="20" height="20" fill="#0f172a" />
        <rect x="60" y="60" width="20" height="20" fill="#ffffff" />
        <rect x="90" y="80" width="40" height="40" fill="#ffffff" />
      </g>
    </g>
  </g>

  <!-- Informações ao lado -->
  <g transform="translate(540, 140)">
    <rect x="0" y="0" width="260" height="34" rx="17" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
    <text x="25" y="22" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="1.5">APLICATIVO OFICIAL DO TSE</text>

    <text x="0" y="85" font-size="34" font-weight="900" fill="#ffffff">e-Título: Documento</text>
    <text x="0" y="125" font-size="34" font-weight="900" fill="#38bdf8">Eleitoral no Celular</text>

    <rect x="0" y="145" width="100" height="4" rx="2" fill="#38bdf8" />

    <text x="0" y="185" font-size="16" font-weight="500" fill="#e2e8f0">Substitui o documento físico de votação com segurança máxima</text>
    <text x="0" y="210" font-size="16" font-weight="500" fill="#cbd5e1">e permite consultas rápidas de local e seção eleitoral.</text>

    <!-- Bullets -->
    <g transform="translate(0, 245)">
      <circle cx="12" cy="12" r="12" fill="#0284c7" />
      <path d="M8 12 L11 15 L17 9" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="32" y="16" font-size="14" font-weight="700" fill="#ffffff">Foto e Biometria Integradas</text>

      <g transform="translate(0, 45)">
        <circle cx="12" cy="12" r="12" fill="#0284c7" />
        <path d="M8 12 L11 15 L17 9" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="32" y="16" font-size="14" font-weight="700" fill="#ffffff">Quitação Eleitoral Instantânea</text>
      </g>

      <g transform="translate(0, 90)">
        <circle cx="12" cy="12" r="12" fill="#0284c7" />
        <path d="M8 12 L11 15 L17 9" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="32" y="16" font-size="14" font-weight="700" fill="#ffffff">Justificativa Eleitoral sem Filas</text>
      </g>
    </g>
  </g>
</svg>
