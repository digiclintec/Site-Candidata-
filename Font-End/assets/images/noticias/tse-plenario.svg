<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#071426; font-family: -apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGradTse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07152b" />
      <stop offset="50%" stop-color="#0e2347" />
      <stop offset="100%" stop-color="#0a1933" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGradTse)" />

  <!-- Detalhe arquitetônico Plenário do TSE -->
  <g opacity="0.12" stroke="#d4af37" stroke-width="1.5">
    <ellipse cx="600" cy="550" rx="550" ry="160" fill="none" />
    <ellipse cx="600" cy="550" rx="430" ry="120" fill="none" />
    <ellipse cx="600" cy="550" rx="310" ry="80" fill="none" />
  </g>

  <!-- Brasão Central Plenário TSE -->
  <g transform="translate(600, 220)">
    <circle cx="0" cy="0" r="90" fill="#0f1f38" stroke="url(#goldGrad2)" stroke-width="3" />
    <circle cx="0" cy="0" r="82" fill="none" stroke="#38bdf8" stroke-dasharray="6 4" stroke-width="1.5" />
    <!-- Balança da Justiça -->
    <path d="M0 -45 L0 45 M-35 -15 L35 -15 M-35 -15 L-50 20 L-20 20 Z M35 -15 L20 20 L50 20 Z" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="-45" r="5" fill="#fbbf24" />
    <!-- Estrelas -->
    <path d="M0 -62 L2 -56 L8 -56 L3 -52 L5 -46 L0 -50 L-5 -46 L-3 -52 L-8 -56 L-2 -56 Z" fill="#ffffff" />
  </g>

  <!-- Textos Oficiais -->
  <g transform="translate(600, 370)" text-anchor="middle">
    <!-- Tag Superior -->
    <rect x="-170" y="-30" width="340" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="-8" font-size="12.5" font-weight="800" fill="#38bdf8" letter-spacing="2">TRIBUNAL SUPERIOR ELEITORAL</text>

    <!-- Título Principal -->
    <text x="0" y="45" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Calendário Eleitoral 2026</text>
    <text x="0" y="85" font-size="22" font-weight="700" fill="#fbbf24" letter-spacing="1">RESOLUÇÕES E DIRETRIZES DO PLENÁRIO</text>

    <!-- Linha divisória -->
    <line x1="-150" y1="110" x2="150" y2="110" stroke="#475569" stroke-width="1.5" />

    <!-- Subtítulo -->
    <text x="0" y="145" font-size="16" font-weight="500" fill="#cbd5e1">Normas gerais para registro de candidatura, prazos, votação e prestação de contas</text>
    <text x="0" y="175" font-size="13.5" font-weight="600" fill="#94a3b8">Brasília, DF • Sessão Administrativa Oficial</text>
  </g>
</svg>
