<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" preserveAspectRatio="xMidYMid meet" style="background:#071426; font-family: -apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradiente de Fundo Premium Azul Oficial e Ouro -->
    <linearGradient id="bgGradContas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061222" />
      <stop offset="45%" stop-color="#0d2440" />
      <stop offset="100%" stop-color="#05101e" />
    </linearGradient>

    <!-- Gradiente Dourado TSE -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Gradiente Esmeralda de Conformidade -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Filtro de Brilho Sutil -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo com Moldura Suave -->
  <rect width="1200" height="675" fill="url(#bgGradContas)" />
  <rect x="20" y="20" width="1160" height="635" rx="20" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="2" />

  <!-- Emblema Central de Auditoria e Prestação de Contas -->
  <g transform="translate(600, 210)">
    <!-- Círculo Externo com Halo Dourado -->
    <circle cx="0" cy="0" r="115" fill="#0a1d33" stroke="url(#goldGrad)" stroke-width="4" filter="url(#softGlow)" />
    <circle cx="0" cy="0" r="98" fill="#061427" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" stroke-dasharray="6,4" />

    <!-- Prancheta Oficial SPCE -->
    <g transform="translate(0, -10)">
      <!-- Prancheta Base -->
      <rect x="-42" y="-45" width="84" height="106" rx="10" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="3" />
      <!-- Presilha Superior Dourada -->
      <rect x="-25" y="-57" width="50" height="18" rx="5" fill="url(#goldGrad)" />
      <circle cx="0" cy="-48" r="4" fill="#061427" />

      <!-- Linhas de Demonstração Contábil -->
      <line x1="-24" y1="-18" x2="24" y2="-18" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
      <line x1="-24" y1="-2" x2="24" y2="-2" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
      <line x1="-24" y1="14" x2="10" y2="14" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
      <line x1="-24" y1="30" x2="16" y2="30" stroke="#34d399" stroke-width="4" stroke-linecap="round" />

      <!-- Selo de Verificação com Cifrão / Check Oficial -->
      <circle cx="28" cy="38" r="22" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="3" />
      <text x="28" y="46" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text>
    </g>
  </g>

  <!-- Tipografia Oficial de Alta Definição (Sem textos minúsculos) -->
  <g transform="translate(600, 395)" text-anchor="middle">
    <!-- Tag Superior do Tribunal -->
    <rect x="-240" y="-32" width="480" height="42" rx="21" fill="rgba(30, 41, 59, 0.9)" stroke="url(#goldGrad)" stroke-width="2" />
    <text x="0" y="-5" font-size="16" font-weight="800" fill="#fbbf24" letter-spacing="2.5">JUSTIÇA ELEITORAL • SISTEMA SPCE</text>

    <!-- Título de Alto Impacto -->
    <text x="0" y="60" font-size="48" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Prestação de Contas Eleitorais</text>

    <!-- Subtítulo e Portal DivulgaCandContas -->
    <text x="0" y="112" font-size="26" font-weight="800" fill="#fbbf24" letter-spacing="1">SISTEMA SPCE 2026 &amp; DIVULGACANDCONTAS</text>

    <!-- Linha Divisória Elegante -->
    <line x1="-220" y1="146" x2="220" y2="146" stroke="rgba(245, 158, 11, 0.45)" stroke-width="2" />

    <!-- Badges Oficiais Inferiores de Transparência -->
    <g transform="translate(0, 185)">
      <rect x="-260" y="-18" width="520" height="36" rx="18" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />
      <text x="0" y="6" font-size="16" font-weight="700" fill="#34d399" letter-spacing="1">TRANSPARÊNCIA PÚBLICA • AUDITORIA OFICIAL TSE</text>
    </g>
  </g>
</svg>
