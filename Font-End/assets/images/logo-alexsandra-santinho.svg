<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 170" width="100%" height="100%">
  <defs>
    <!-- Gradiente Metálico das Letras (como no santinho) -->
    <linearGradient id="textMetallicDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Gradiente Fita Brasil (Verde para Amarelo) -->
    <linearGradient id="brazilRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#008b38"/>
      <stop offset="38%" stop-color="#00a843"/>
      <stop offset="58%" stop-color="#f8b319"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>

    <!-- Gradiente Linhas Tapered TOMAZ -->
    <linearGradient id="lineLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0)"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="lineRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0)"/>
    </linearGradient>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#subtleGlow)">
    <!-- ====================================================================
         LETRA 'A' COM FITA DO BRASIL
         ==================================================================== -->
    <g transform="translate(10, 8)">
      <!-- Topo e Perna Direita do 'A' (Metálico / Branco) -->
      <path d="M 46,6 L 66,6 L 94,92 L 72,92 L 63,64 L 38,64 L 46,38 L 52,18 Z" fill="url(#textMetallicDark)"/>
      <!-- Perna Esquerda Superior -->
      <path d="M 46,6 L 52,18 L 36,46 L 24,46 Z" fill="url(#textMetallicDark)"/>
      
      <!-- Fita Curva do Brasil (Verde subindo para Amarelo Ouro cruzando o A) -->
      <!-- Perna inferior verde -->
      <path d="M 10,92 L 24,52 C 26,46 32,44 40,46 L 76,54 C 84,56 88,60 84,66 L 70,68 C 58,66 42,62 34,66 L 26,92 Z" fill="url(#brazilRibbon)"/>
      
      <!-- Destaque Amarelo na curva da fita -->
      <path d="M 28,68 C 36,54 50,52 68,54 L 84,56 C 88,57 87,63 81,64 L 62,66 C 48,66 38,70 32,80 Z" fill="#ffcc00"/>
    </g>

    <!-- ====================================================================
         LETRAS 'LEXSANDRA' (Em itálico pesado 900)
         ==================================================================== -->
    <text x="106" y="98" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="94" font-weight="900" font-style="italic" letter-spacing="-2" fill="url(#textMetallicDark)">LEXSANDRA</text>

    <!-- ====================================================================
         SUB-BARRA DUPLA (VERDE E AMARELA ABAIXO DE 'ANDRA')
         ==================================================================== -->
    <!-- Barra Verde (sob AND) -->
    <rect x="365" y="106" width="135" height="7" rx="2" fill="#008b38" transform="skewX(-14)"/>
    <!-- Barra Amarela (sob RA) -->
    <rect x="504" y="106" width="130" height="7" rx="2" fill="#ffcc00" transform="skewX(-14)"/>

    <!-- ====================================================================
         LINHA INFERIOR: — TOMAZ —
         ==================================================================== -->
    <!-- Linha Tapered Esquerda -->
    <path d="M 60,135 L 235,137 L 235,133 Z" fill="url(#lineLeft)"/>
    
    <!-- Nome TOMAZ Centralizado -->
    <text x="340" y="142" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="34" font-weight="900" font-style="italic" letter-spacing="12" text-anchor="middle" fill="#f59e0b">TOMAZ</text>
    
    <!-- Linha Tapered Direita -->
    <path d="M 445,137 L 620,135 L 445,133 Z" fill="url(#lineRight)"/>

    <!-- ====================================================================
         SUBTÍTULO: DEPUTADA FEDERAL • 2223
         ==================================================================== -->
    <text x="340" y="165" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800" letter-spacing="8" text-anchor="middle" fill="#94a3b8">DEPUTADA FEDERAL</text>
  </g>
</svg>
