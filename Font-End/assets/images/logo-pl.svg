<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" width="100%" height="100%">
  <defs>
    <clipPath id="pl-clip">
      <rect x="0" y="0" width="120" height="130" rx="16" ry="16" />
    </clipPath>
    <linearGradient id="pl-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0052a5" />
      <stop offset="100%" stop-color="#003b7a" />
    </linearGradient>
  </defs>

  <g clip-path="url(#pl-clip)">
    <!-- Fundo Azul PL -->
    <rect x="0" y="0" width="120" height="130" fill="url(#pl-blue)" />

    <!-- Arco Verde (Canto superior direito) -->
    <path d="M 65 0 C 78 0, 100 2, 120 28 L 120 0 Z" fill="#009c3b" />

    <!-- Faixa Amarela da Bandeira -->
    <path d="M 12 25 C 45 10, 85 10, 120 40 L 120 28 C 100 2, 78 0, 65 0 L 12 0 C 12 8, 12 18, 12 25 Z" fill="#ffcd00" />

    <!-- Sigla PL em Vetor Fiel -->
    <g transform="skewX(-9) translate(14, 0)">
      <!-- Letra P -->
      <path d="M 24 38 L 47 38 C 56 38, 62 43, 62 52 C 62 61, 56 66, 47 66 L 37 66 L 37 84 L 24 84 Z M 37 49 L 37 55 L 45 55 C 48 55, 50 54, 50 52 C 50 50, 48 49, 45 49 Z" fill="#ffffff" />
      
      <!-- Letra L -->
      <path d="M 62 38 L 75 38 L 75 73 L 95 73 L 95 84 L 62 84 Z" fill="#ffffff" />
    </g>

    <!-- Texto PARTIDO LIBERAL -->
    <text x="60" y="98" 
          font-family="'Montserrat', 'Arial Black', Arial, sans-serif" 
          font-size="9" 
          font-weight="900" 
          letter-spacing="0.6" 
          fill="#ffffff" 
          text-anchor="middle">
      PARTIDO LIBERAL
    </text>
  </g>

  <!-- Borda Sutil -->
  <rect x="0.5" y="0.5" width="119" height="129" rx="16" ry="16" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1" />
</svg>
