  <script>
    (function() {
      // 1. Prevenção absoluta contra loop infinito
      var loopKey = 'redirect_loop_guard';
      var attempts = parseInt(sessionStorage.getItem(loopKey) || '0', 10);
      var currentPath = window.location.pathname || '';

      // Se a URL já estiver dentro de Font-End ou se já tentou redirecionar, aborta para não criar loop
      if (currentPath.indexOf('Font-End') !== -1 || attempts >= 2) {
        sessionStorage.removeItem(loopKey);
        return;
      }

      sessionStorage.setItem(loopKey, String(attempts + 1));

      // 2. Constrói o destino com caminho absoluto canônico
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var origin = window.location.origin || '';

      // Limpa repetições de /index do caminho
      var cleanPath = currentPath.replace(/\/index(\.html)?$/i, '').replace(/\/+$/, '');
      var target;

      if (window.location.protocol === 'file:') {
        target = 'Font-End/index.html' + search + hash;
      } else {
        target = origin + cleanPath + '/Font-End/index.html' + search + hash;
      }

      try {
        window.location.replace(target);
      } catch (e) {
        window.location.href = target;
      }
    })();
  </script>
